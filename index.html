<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HASHIR: THE LAST HERO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#050817;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#movie{width:100%;height:100%;position:relative;overflow:hidden;background:#080c27}
canvas{width:100%;height:100%;position:absolute;inset:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:25px 25px 90px;pointer-events:none;background:linear-gradient(transparent 50%,rgba(0,0,0,.85))}
.fade{transition:opacity .6s;opacity:1}
.fade.out{opacity:0;transition:none}
#title{font-size:clamp(24px,5.5vw,52px);font-weight:900;text-shadow:0 0 20px #00c8ff;letter-spacing:3px;margin-bottom:10px}
#description{font-size:clamp(14px,2.6vw,20px);max-width:750px;line-height:1.5;text-shadow:0 2px 5px #000;margin-bottom:12px}
#dialogue{color:#66eaff;font-size:clamp(14px,2.6vw,20px);font-weight:bold;min-height:28px}
.controls{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px))}
button{background:#087bdc;color:#fff;border:1px solid #5bdcff;padding:12px 20px;border-radius:30px;cursor:pointer;font-size:14px;font-weight:bold;transition:.2s}
button:hover{background:#00bfff;transform:scale(1.06)}
#progress{position:absolute;top:0;left:0;height:5px;background:#00d9ff;width:0;transition:width .4s}
#sceneNumber{position:absolute;top:calc(15px + env(safe-area-inset-top,0px));right:18px;font-size:13px;color:#a9c9ff}
@media(max-width:600px){button{padding:10px 13px;font-size:12px}.controls{gap:6px}}
</style>
</head>
<body>
<div id="movie">
<canvas id="screen" width="1488" height="811"></canvas>
<div id="progress" style="width: 11.1111%;"></div>
<div id="sceneNumber">SCENE 1 / 9</div>
<div class="overlay">
<div id="title" class="fade">HASHIR: THE LAST HERO</div>
<div id="description" class="fade">Far beyond the stars, in a distant galaxy, a special baby was born.</div>
<div id="dialogue">Narrator: This is the story of Hashir...</div>
</div>
<div class="controls">
<button onclick="previousScene()">◀ BACK</button>
<button onclick="togglePlay()" id="playBtn">▶ PLAY</button>
<button onclick="nextScene()">NEXT ▶</button>
<button onclick="toggleSound()" id="soundBtn">🔊 SOUND ON</button>
<button onclick="restart()">↻ RESTART</button>
</div>
</div>
<script>
const canvas=document.getElementById("screen"),ctx=canvas.getContext("2d");
let W,H,scene=0,playing=false,sound=true,elapsed=0,lastTime=0,audioCtx=null,drone=null,typer=null;

const scenes=[
{title:"HASHIR: THE LAST HERO",description:"Far beyond the stars, in a distant galaxy, a special baby was born.",dialogue:"Narrator: This is the story of Hashir...",duration:7000,type:"birth",fall:false},
{title:"THE PLANET IS DYING",description:"One day, while Hashir was going to get food, his peaceful planet began to collapse.",dialogue:"People: THE PLANET IS BEING DESTROYED!",duration:8000,type:"destruction",fall:false},
{title:"THE GREAT ESCAPE",description:"The leader ordered everyone to escape to different planets. Baby Hashir was sent to Earth.",dialogue:"Leader: Save the children! Send them to Earth!",duration:8000,type:"escape",fall:true},
{title:"WELCOME TO EARTH",description:"Hashir arrived on Earth. But some robbers noticed him and tried to rob him.",dialogue:"Robber: Hey! Give us everything!",duration:8000,type:"earth",fall:false},
{title:"THE FIRST SUPERPOWER",description:"The robbers had no idea who they were dealing with. Hashir easily defeated them.",dialogue:"Hashir: You picked the wrong person!",duration:8000,type:"fight",fall:false},
{title:"A MYSTERIOUS PAIN",description:"Later, in his apartment, Hashir suddenly felt an incredible pain throughout his body.",dialogue:"Hashir: What is happening to me?!",duration:8000,type:"pain",fall:false},
{title:"THE TRANSFORMATION",description:"A mysterious energy awakened inside Hashir. His true powers were finally beginning to appear.",dialogue:"Hashir: I CAN FEEL THE POWER!",duration:9000,type:"transform",fall:false},
{title:"THE LAST HERO",description:"Hashir became a hero. His incredible powers made him famous, and people began to admire him.",dialogue:"Crowd: HASHIR! HASHIR! OUR HERO!",duration:9000,type:"hero",fall:false},
{title:"THE END... OR A NEW BEGINNING?",description:"Born in another galaxy. Raised on Earth. Destined to become a legend.",dialogue:"HASHIR WILL RETURN!",duration:10000,type:"ending",fall:false}
];

let stars=[];
function resize(){
canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
W=innerWidth;H=innerHeight;
stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,size:Math.random()*2+.5,speed:Math.random()*.6+.2});
}
addEventListener("resize",resize);resize();

function gradient(a,b){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function starsDraw(t,fall){
stars.forEach(s=>{
if(fall){s.y+=s.speed;if(s.y>H)s.y=0}
ctx.fillStyle="#fff";ctx.globalAlpha=.5+Math.sin(t/500+s.x)*.4;
ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
});
ctx.globalAlpha=1;
}
function planet(x,y,r,color){
const g=ctx.createRadialGradient(x-r*.3,y-r*.4,2,x,y,r);
g.addColorStop(0,"#fff");g.addColorStop(.2,color);g.addColorStop(1,"#11152f");
ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function alien(x,y,scale=1,glow=false){
ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
if(glow){ctx.shadowColor="#00dfff";ctx.shadowBlur=30}
ctx.fillStyle="#21c6a2";ctx.beginPath();ctx.ellipse(0,35,24,32,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#56edc9";ctx.beginPath();ctx.ellipse(0,0,34,38,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#07132c";ctx.beginPath();ctx.ellipse(-13,-3,9,13,-.2,0,Math.PI*2);ctx.ellipse(13,-3,9,13,.2,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-15,-8,3,0,Math.PI*2);ctx.arc(11,-8,3,0,Math.PI*2);ctx.fill();
ctx.strokeStyle="#075d54";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,8,10,.2,Math.PI-.2);ctx.stroke();
ctx.strokeStyle="#56edc9";ctx.lineWidth=9;ctx.lineCap="round";
ctx.beginPath();ctx.moveTo(-18,28);ctx.lineTo(-34,48);ctx.moveTo(18,28);ctx.lineTo(34,48);ctx.stroke();
ctx.strokeStyle="#168b85";ctx.beginPath();ctx.moveTo(-10,60);ctx.lineTo(-14,85);ctx.moveTo(10,60);ctx.lineTo(14,85);ctx.stroke();
ctx.restore();ctx.shadowBlur=0;
}
function ground(){ctx.fillStyle="#111c31";ctx.fillRect(0,H*.8,W,H*.2)}
function explosion(x,y,r,t){
const p=(t%1500)/1500;
for(let i=0;i<18;i++){
const a=i*Math.PI*2/18,d=p*r;
ctx.fillStyle=i%2?"#ff8c28":"#ffe35b";
ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.max(1,7*(1-p)),0,Math.PI*2);ctx.fill();
}
}
function robber(x,y){
ctx.fillStyle="#252336";
ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
ctx.fillRect(x-20,y+22,40,75);
ctx.fillStyle="#fff";ctx.fillRect(x-12,y-5,8,5);ctx.fillRect(x+4,y-5,8,5);
}

function draw(t){
ctx.clearRect(0,0,W,H);
const sc=scenes[scene],s=sc.type,time=t/1000;
if(s==="birth"){
gradient("#10052e","#080d27");starsDraw(t,sc.fall);
planet(W*.5,H*.5,110,"#7942c7");
ctx.strokeStyle="#a77cff";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W*.5,H*.5,160,35,-.3,0,Math.PI*2);ctx.stroke();
alien(W*.5,H*.4,.8+Math.sin(time*2)*.08,true);
}
if(s==="destruction"){
gradient("#1c0714","#270c20");starsDraw(t,sc.fall);
planet(W*.5,H*.45,130,"#c43e3e");
explosion(W*.25,H*.25,130,t);explosion(W*.8,H*.5,120,t+400);
ctx.fillStyle="#ff6b29";ctx.globalAlpha=.3;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}
if(s==="escape"){
gradient("#090a28","#222c55");starsDraw(t,sc.fall);
planet(W*.5,H*.62,120,"#bd493d");
const x=W*.15+(time*45)%(W*.7);
ctx.fillStyle="#c6f4ff";ctx.beginPath();ctx.moveTo(x,H*.3);ctx.lineTo(x-35,H*.43);ctx.lineTo(x+35,H*.43);ctx.closePath();ctx.fill();
ctx.fillStyle="#ffad43";ctx.beginPath();ctx.moveTo(x-12,H*.43);ctx.lineTo(x,H*.53+Math.random()*10);ctx.lineTo(x+12,H*.43);ctx.fill();
alien(x,H*.23,.35,true);
}
if(s==="earth"||s==="fight"){
gradient("#347fc1","#d2a0a0");
ctx.fillStyle="#182b46";
for(let i=0;i<9;i++){
const x=i*W/8;ctx.fillRect(x,H*.4,55,H*.43);
ctx.fillStyle="#f7e69b";for(let j=0;j<4;j++)ctx.fillRect(x+10,H*.45+j*30,8,10);
ctx.fillStyle="#182b46";
}
ground();
alien(W*.5,H*.42,1,s==="fight");
if(s==="fight"){
robber(W*.2,H*.5);robber(W*.8,H*.5);
explosion(W*.3,H*.62,70,t);explosion(W*.7,H*.62,70,t+300);
}else{
robber(W*.25,H*.5);robber(W*.75,H*.5);
}
}
if(s==="pain"){
gradient("#100b25","#291138");ground();
ctx.fillStyle="#382b4a";ctx.fillRect(W*.1,H*.12,W*.8,H*.68);
ctx.fillStyle="#141c34";ctx.fillRect(W*.16,H*.22,W*.25,H*.27);
alien(W*.5,H*.38,1.2,true);
for(let i=0;i<10;i++){
const a=i*Math.PI/5+time;
ctx.strokeStyle="#b05dff";ctx.lineWidth=3;ctx.beginPath();
ctx.moveTo(W*.5,H*.48);ctx.lineTo(W*.5+Math.cos(a)*90,H*.48+Math.sin(a)*90);ctx.stroke();
}
}
if(s==="transform"){
gradient("#070c28","#24105c");starsDraw(t,sc.fall);
const r=100+Math.sin(time*3)*25;
ctx.strokeStyle="#00eaff";ctx.lineWidth=5;ctx.shadowColor="#00eaff";ctx.shadowBlur=30;
ctx.beginPath();ctx.arc(W*.5,H*.42,r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
alien(W*.5,H*.34,1.5,true);
explosion(W*.5,H*.42,180,t);
}
if(s==="hero"){
gradient("#102b65","#4b92bd");starsDraw(t,sc.fall);ground();
ctx.fillStyle="#172c52";
for(let i=0;i<12;i++)ctx.fillRect(i*W/11,H*.4,45,H*.42);
alien(W*.5,H*.28,1.6,true);
}
if(s==="ending"){
gradient("#030614","#17113f");starsDraw(t,sc.fall);
planet(W*.5,H*.5,90,"#6448c6");
alien(W*.5,H*.26,1.4,true);
ctx.strokeStyle="#00dfff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(W*.5,H*.26+30,120,0,Math.PI*2);ctx.stroke();
}
// scene fade-in from black
if(elapsed<700){ctx.fillStyle="#000";ctx.globalAlpha=1-elapsed/700;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}

function typeDialogue(text){
const el=document.getElementById("dialogue");
clearInterval(typer);el.textContent="";let i=0;
typer=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typer)},35);
}
function showScene(){
const s=scenes[scene];
const fades=document.querySelectorAll(".fade");
fades.forEach(e=>e.classList.add("out"));
document.getElementById("title").textContent=s.title;
document.getElementById("description").textContent=s.description;
document.getElementById("sceneNumber").textContent=`SCENE ${scene+1} / ${scenes.length}`;
document.getElementById("progress").style.width=((scene+1)/scenes.length*100)+"%";
setTimeout(()=>fades.forEach(e=>e.classList.remove("out")),60);
typeDialogue(s.dialogue);
elapsed=0;lastTime=performance.now();
if(playing)playSound(200+scene*60);
}
function nextScene(){
if(scene<scenes.length-1){scene++;showScene()}
else{playing=false;document.getElementById("playBtn").textContent="▶ PLAY";stopDrone()}
}
function previousScene(){if(scene>0){scene--;showScene()}}
function restart(){scene=0;playing=false;stopDrone();document.getElementById("playBtn").textContent="▶ PLAY";showScene()}
function togglePlay(){
playing=!playing;
document.getElementById("playBtn").textContent=playing?"❚❚ PAUSE":"▶ PLAY";
lastTime=performance.now();
if(playing){playSound(440);startDrone()}else stopDrone();
}
function toggleSound(){
sound=!sound;
document.getElementById("soundBtn").textContent=sound?"🔊 SOUND ON":"🔇 SOUND OFF";
if(!sound)stopDrone();else if(playing)startDrone();
}
function ac(){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==="suspended")audioCtx.resume();
return audioCtx;
}
function playSound(freq){
if(!sound)return;
try{
const a=ac(),osc=a.createOscillator(),gain=a.createGain();
osc.type="sine";osc.frequency.setValueAtTime(freq,a.currentTime);
osc.frequency.exponentialRampToValueAtTime(freq/2,a.currentTime+.4);
gain.gain.setValueAtTime(.12,a.currentTime);
gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
osc.connect(gain);gain.connect(a.destination);osc.start();osc.stop(a.currentTime+.5);
}catch(e){}
}
function startDrone(){
if(!sound||drone)return;
try{
const a=ac(),gain=a.createGain();gain.gain.value=.025;gain.connect(a.destination);
const oscs=[110,165,220.5].map(f=>{const o=a.createOscillator();o.type="triangle";o.frequency.value=f;o.connect(gain);o.start();return o});
drone={oscs,gain};
}catch(e){}
}
function stopDrone(){
if(!drone)return;
try{drone.oscs.forEach(o=>o.stop())}catch(e){}
drone=null;
}

function animate(now){
const dt=Math.min(now-lastTime,100);lastTime=now;
if(playing){
elapsed+=dt;
if(elapsed>=scenes[scene].duration)nextScene();
}else if(elapsed<700){elapsed+=dt}
draw(now);
requestAnimationFrame(animate);
}
showScene();
requestAnimationFrame(animate);
</script>


</body></html>
